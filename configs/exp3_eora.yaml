# configs/exp3_eora.yaml
# Experiment 3: Quantized recovery with EoRA (teacher=optimized FP, student=quantized GPTQ)

model_name: "gpt2"
task_type: "classification"
num_labels: 2
seed: 42

# 输出根目录（脚本会自动创建 r{rank}_ar{...} 子目录，不会覆盖）
output_dir: "outputs/exp3_eora"

optimized_model_dir: "outputs/optimized_sst2/model"
quantized_model_dir: "outputs/quantize_optimized_sst2"   # <- 改成你真实路径

data:
  dataset_name: "glue/sst2"
  dataset_config_name: null
  max_length: 128
  batch_size: 8
  num_workers: 0
  use_internal_test: true
  internal_test_size: 0.1

# 额外：是否记录 quantized baseline（强烈建议 true）
do_quant_baseline_eval: true

eora:
  rank: 64
  alpha: 80     # ar = alpha/rank = 1.25
  calibration_num_samples: 512

  # 强烈建议用本地文本，避免HF SSL问题
  calibration_local_txt: "data/wikitext2_like/train.txt"
