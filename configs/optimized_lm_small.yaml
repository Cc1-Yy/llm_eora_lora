# configs/optimized_lm_small.yaml

model_name: "gpt2"
task_type: "lm"
seed: 42
output_dir: "outputs/optimized_lm_small"

data:
  train_corpus:
    name: "allenai/c4"
    config: "en"
    split: "train"
    streaming: true
    max_train_samples: 50000
    text_key: "text"
    shuffle_buffer: 10000

  eval_corpus:
    local_disk_path: "data_cache/wikitext2_raw"
    split: "validation"
    text_key: "text"

  test_corpus:
    local_disk_path: "data_cache/wikitext2_raw"
    split: "test.py"
    text_key: "text"

  max_length: 1024
  batch_size: 2
  num_workers: 0

train:
  lr: 5e-5
  weight_decay: 0.01
  num_epochs: 1
  grad_clip: 1.0
