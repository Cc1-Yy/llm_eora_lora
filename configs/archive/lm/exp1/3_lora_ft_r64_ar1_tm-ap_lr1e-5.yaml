model_name: gpt2
task_type: causal_lm
seed: 42
output_dir: outputs/lm/exp1/3_lora_ft_r64_ar1_tm-ap_lr1e-5
data:
  train_corpus:
    local_disk_path: data_cache/wikitext2_raw
    split: train
    text_key: text
  eval_corpus:
    local_disk_path: data_cache/wikitext2_raw
    split: validation
    text_key: text
  test_corpus:
    local_disk_path: data_cache/wikitext2_raw
    split: test
    text_key: text
  max_length: 256
  batch_size: 4
  num_workers: 0
  pin_memory: true
  persistent_workers: false
  pad_to_multiple_of: 8
lora:
  rank: 64
  alpha: 64
  dropout: 0.05
  target_modules:
  - c_attn
  - c_proj
train:
  lr: 1.0e-05
  weight_decay: 0.01
  num_epochs: 3
  grad_clip: 1.0
  max_train_steps: 6000
  use_amp: true
  grad_accum_steps: 2
  warmup_ratio: 0.03
  scheduler: linear
  log_every_steps: 50
  eval_every_steps: 1000
