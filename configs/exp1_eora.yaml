# configs/exp1_eora.yaml
# Exp1 - EoRA branch (NO quantization):
# base (pretrained) + closed-form low-rank adapter  -> approximate optimized (full fine-tuned)

model_name: "gpt2"
task_type: "classification"
num_labels: 2

seed: 42
output_dir: "outputs/exp1_eora"

# 你给定的 optimized 模型路径（teacher）
optimized_model_dir: "outputs/optimized_sst2/model"

data:
  dataset_name: "glue/sst2"
  dataset_config_name: null
  max_length: 128
  batch_size: 8
  num_workers: 0
  use_internal_test: true
  internal_test_size: 0.1

# EoRA（closed-form low-rank delta approximation）参数
eora:
  rank: 8
  # 建议 alpha = rank => scaling = alpha/rank = 1
  alpha: 8
  dropout: 0.0
  target_modules: ["c_attn", "c_proj"]

  # SVD 是否放 CPU 做（更稳，避免 GPU 显存波动）
  svd_on_cpu: true
