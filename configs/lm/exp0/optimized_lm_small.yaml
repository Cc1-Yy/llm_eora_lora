model_name: "gpt2"
task_type: "causal_lm"
seed: 42
output_dir: "outputs/lm/exp0/optimized_lm_small"
export_best_model_dir: "outputs/lm/exp0/optimized_small/model"

data:
  train_corpus:
    local_disk_path: "data_cache/wikitext2_raw"
    split: "train"
    text_key: "text"

  eval_corpus:
    local_disk_path: "data_cache/wikitext2_raw"
    split: "validation"
    text_key: "text"

  test_corpus:
    local_disk_path: "data_cache/wikitext2_raw"
    split: "test"
    text_key: "text"

  max_length: 256
  batch_size: 4
  num_workers: 0
  pin_memory: true
  persistent_workers: false
  pad_to_multiple_of: 8

train:
  lr: 2.0e-5
  weight_decay: 0.01
  num_epochs: 1
  grad_clip: 1.0

  # 关键：固定 teacher 步数（比如 6000）
  max_train_steps: 6000

  use_amp: true
  grad_accum_steps: 2
  warmup_ratio: 0.03
  scheduler: "linear"

  log_every_steps: 50
  eval_every_steps: 1000
