model_name: outputs/lm/exp0/quantized_optimized_small_gptq4
tokenizer_name: outputs/lm/exp0/optimized_small/model
task_type: causal_lm
seed: 42

output_dir: outputs/lm/exp3/1_lora_recover_q4_r16_ar1_tm-ap_smoke

optimized_model_dir: outputs/lm/exp0/optimized_small/model
quantized_model_dir: outputs/lm/exp0/quantized_optimized_small_gptq4

data:
  train_corpus:
    local_disk_path: data_cache/wikitext2_raw
    split: train
    text_key: text
  eval_corpus:
    local_disk_path: data_cache/wikitext2_raw
    split: validation
    text_key: text
  test_corpus:
    local_disk_path: data_cache/wikitext2_raw
    split: test
    text_key: text
  max_length: 256
  batch_size: 4
  num_workers: 0
  pin_memory: true
  persistent_workers: false
  prefetch_factor: 2
  pad_to_multiple_of: 8

lora:
  rank: 16
  alpha: 16
  dropout: 0.05
  target_modules:
    - c_attn
    - c_proj

train:
  lr: 1.5e-05
  weight_decay: 0.01
  num_epochs: 3
  grad_clip: 1.0
  max_train_steps: 200
  use_amp: true
  grad_accum_steps: 2
  warmup_ratio: 0.03
  scheduler: linear
  log_every_steps: 20
  eval_every_steps: 100

distill:
  temperature: 1.0

select_best_by: loss