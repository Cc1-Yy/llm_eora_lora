model_name: gpt2
tokenizer_name: outputs/lm/exp0/optimized_small/model
task_type: causal_lm
seed: 42

output_dir: outputs/lm/exp3/1_eora_q3_r16

optimized_model_dir: outputs/lm/exp0/optimized_small/model
quantized_model_dir: outputs/lm/exp0/quantize_optimized_lm_small_3bit

data:
  train_corpus:
    local_disk_path: data_cache/wikitext2_raw
    split: train
    text_key: text
  eval_corpus:
    local_disk_path: data_cache/wikitext2_raw
    split: validation
    text_key: text
  test_corpus:
    local_disk_path: data_cache/wikitext2_raw
    split: test
    text_key: text
  max_length: 256
  batch_size: 4
  num_workers: 0
  pin_memory: true
  persistent_workers: false
  prefetch_factor: 2
  pad_to_multiple_of: 8

eora:
  rank: 16
  alpha: 16
  calibration_num_samples: 128
  calibration_dataset_concat_size: 1024
  repair_adapter_orientation: true

distill:
  temperature: 1.0