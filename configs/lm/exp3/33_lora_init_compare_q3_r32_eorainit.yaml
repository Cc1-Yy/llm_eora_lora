model_name: outputs/lm/exp0/quantize_optimized_lm_small_3bit
tokenizer_name: outputs/lm/exp0/optimized_small/model
task_type: causal_lm
seed: 42

output_dir: outputs/lm/exp3/33_lora_init_compare_q3_r32_eorainit

optimized_model_dir: outputs/lm/exp0/optimized_small/model
quantized_model_dir: outputs/lm/exp0/quantize_optimized_lm_small_3bit

data:
  train_corpus:
    local_disk_path: data_cache/wikitext2_raw
    split: train
    text_key: text
  eval_corpus:
    local_disk_path: data_cache/wikitext2_raw
    split: validation
    text_key: text
  test_corpus:
    local_disk_path: data_cache/wikitext2_raw
    split: test
    text_key: text
  max_length: 256
  batch_size: 4
  num_workers: 0
  pin_memory: true
  persistent_workers: false
  prefetch_factor: 2
  pad_to_multiple_of: 8

lora:
  rank: 32
  alpha: 32
  dropout: 0.05
  target_modules:
    - c_attn
    - c_proj

lora_init:
  mode: eora_adapter
  adapter_dir: outputs/lm/exp3/1_eora_q3_r32/adapter
  strict: true
  evaluate_before_train: true

train:
  lr: 1.5e-05
  weight_decay: 0.01
  num_epochs: 3
  grad_clip: 1.0
  max_train_steps: 3000
  use_amp: true
  grad_accum_steps: 2
  warmup_ratio: 0.03
  scheduler: linear
  log_every_steps: 50
  eval_every_steps: 100

distill:
  temperature: 1.0

select_best_by: loss