model_name: "gpt2"
task_type: "classification"
num_labels: 2

data:
  dataset_name: "glue/sst2"
  dataset_config_name: null
  max_length: 128
  batch_size: 8
  num_workers: 0
  use_internal_test: true
  internal_test_size: 0.1

train:
  lr: 2e-5
  weight_decay: 0.01
  num_epochs: 5
  grad_clip: 1.0
  eval_every_steps: 0

output_dir: "outputs/optimized_sst2"
seed: 42

