# configs/exp1_lora_lm.yaml
# Exp1 (LM) - LoRA branch:
# base pretrained LM + LoRA fine-tuning on LM corpus
# Compare later with Exp1 EoRA-LM branch

model_name: "gpt2"
task_type: "causal_lm"         # 关键：LM 走 causal_lm
seed: 42

# 建议把 output_dir 设成“根目录”，脚本会自动建 run 子目录（r8_ar1 等）
output_dir: "outputs/exp1_lora_lm"

data:
  # ---- Train: 用更“专业”的大语料（你现在用的 C4 是可以的）----
  train_corpus:
    name: "allenai/c4"
    config: "en"
    split: "train"
    streaming: true
    max_train_samples: 50000     # 先用小规模跑通；后面可以提到 200k/500k
    text_key: "text"
    shuffle_buffer: 10000

  # ---- Eval/Test: 用稳定可复现的数据（你已经缓存到本地）----
  eval_corpus:
    local_disk_path: "data_cache/wikitext2_raw"
    split: "validation"
    text_key: "text"

  test_corpus:
    local_disk_path: "data_cache/wikitext2_raw"
    split: "test"
    text_key: "text"

  max_length: 1024
  batch_size: 2
  num_workers: 0

lora:
  # 你可以从 r=8 起步；后面再扫 r=16/32/64
  rank: 8
  # alpha 通常跟 rank 成比例；alpha/r 比较关键（= scaling）
  alpha: 8                 # 先设 alpha=rank -> alpha/r = 1.0
  dropout: 0.05
  # GPT2 常用 target modules（与你分类实验一致）
  target_modules: ["c_attn", "c_proj"]

train:
  lr: 5e-5
  weight_decay: 0.01
  num_epochs: 1

  grad_clip: 1.0
  use_amp: true            # 你的 3060 必开（11_exp1_lora_lm.py 已支持）
  grad_accum_steps: 1      # 显存紧张再改 2/4（等效增大 batch）
